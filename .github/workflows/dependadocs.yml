on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependadocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wwelsh/dependadocs@v1
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          docs-path: ""
